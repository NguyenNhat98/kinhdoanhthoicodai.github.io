<!doctype html><html><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#eee2c5}iframe{border:0;width:100%;height:100%}</style><iframe id="game" src="../index.html"></iframe><script>
const params=new URLSearchParams(location.search),frame=document.querySelector('#game');frame.style.width=(params.get('width')||390)+'px';frame.style.height=(params.get('height')||844)+'px';
frame.onload=()=>{const w=frame.contentWindow;const style=w.document.createElement('style');style.textContent='*,*::before,*::after{animation:none!important;transition:none!important}';w.document.head.appendChild(style);w.document.querySelector('#splash').hidden=true;w.UI.closeModal();const mode=params.get('mode')||'market';if(mode==='stall'||mode==='prep'){w.CFG.shops.forEach(s=>{w.Game.S.shops[s.id].unlocked=true;w.Game.S.shops[s.id].level=5;});w.Game.S.coins=25000;const shop=params.get('shop')||'trasua';w.Game.S.flags['guide_'+shop]=1;w.Game.S.flags.guideSeen=1;w.WUI.open(shop);if(mode==='stall'){w.WS.start(shop);w.WUI.tab='work';w.WUI.render();w.WS.tick(2);w.WUI.update();}}else {w.UI.showPage(mode);if(params.get('game'))setTimeout(()=>w.Festival.start(params.get('game')),50);}};
</script></html>
<script>document.querySelector('#game').addEventListener('load',()=>setTimeout(()=>{const w=document.querySelector('#game').contentWindow;const report={};for(const q of ['#stall','.st-banner','.st-queue','.st-bench','.b-right','.st-prep']){const e=w.document.querySelector(q);if(e){const s=w.getComputedStyle(e);report[q]={display:s.display,position:s.position,height:s.height,flex:s.flex,rect:e.getBoundingClientRect().height,scroll:e.scrollHeight,client:e.clientHeight};}}const p=document.createElement('pre');p.id='layoutReport';p.textContent=JSON.stringify(report);document.body.appendChild(p);},50));</script>
