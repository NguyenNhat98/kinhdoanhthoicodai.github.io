<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm tra chợ làng</title>
<style>body{margin:0;background:#e6d7b6}iframe{border:0}pre{white-space:pre-wrap}</style>
<iframe id="game" src="../index.html"></iframe><pre id="result">RUNNING</pre><script>
const frame=document.querySelector('#game'),params=new URLSearchParams(location.search);
frame.style.width=(params.get('width')||390)+'px';frame.style.height=(params.get('height')||844)+'px';
frame.addEventListener('load',async()=>{
const w=frame.contentWindow,d=w.document,passed=[],errors=[];
w.addEventListener('error',e=>errors.push(e.message));
const check=(ok,msg)=>{if(!ok)throw Error(msg);passed.push(msg);};
const near=(a,b,epsilon=.1)=>Math.abs(a-b)<epsilon;
try{
 const {MM:M,LivingMarket:L,Game:G,UI}=w;
 d.querySelector('#splash').hidden=true;UI.closeModal();
 G.S.settings.reduce=false;G.S.settings.quality=2;G.S.settings.crowd=16;L.applySettings();
 check(M.H>M.W&&M.W===1024&&M.H===1536,'Map geometry matches the portrait source');
 check(w.MarketWorld.forbiddenSamples.every(p=>!L.isWalkable(...p)),'Roof, shop, water and tree samples are blocked independently of routes');
 const bad=[];
 L.routes.forEach((r,ri)=>r.slice(1).forEach((b,i)=>{const a=r[i];for(let t=0;t<=100;t++){const x=a[0]+(b[0]-a[0])*t/100,y=a[1]+(b[1]-a[1])*t/100;if(!L.isWalkable(x,y))bad.push([ri,i,Math.round(x),Math.round(y)]);}}));
 check(!bad.length,'All route segments lie on authored ground: '+JSON.stringify(bad.slice(0,6)));
 check(L.walkers.length===16,'Crowd uses sixteen distinct villagers');
 const original=L.walkers[0];L.applySettings();M.lastUn=-1;M.refresh();
 check(L.walkers[0]===original,'Settings and shop refresh preserve existing walkers');
 const oldEvents=M.events;UI.showPage('market');
 check(oldEvents.signal.aborted,'Remount disposes old global camera listeners');
 check(M.pts.size===0&&!M.motion,'Remount clears gestures and camera animation');
 const map=d.querySelector('#map'),rect=()=>map.getBoundingClientRect();
 const pointer=(type,id,x,y,target=map)=>target.dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerId:id,pointerType:'touch',clientX:rect().left+x,clientY:rect().top+y,button:0}));
 M.overview();const view=M.view();
 check(near(M.s,M.min)&&M.H*M.s>=view.h+119,'Smallest zoom retains vertical room to drag the street');
 const chapter=d.querySelector('#mapChap'),chapterStyle=w.getComputedStyle(chapter);
 check(parseFloat(chapterStyle.fontSize)<=10&&chapter.getBoundingClientRect().width<=view.w*.7&&chapter.offsetTop<70,'Chapter text is small and tucked into the upper corner');
 check(chapterStyle.backgroundColor.startsWith('rgba')&&Number(chapterStyle.backgroundColor.match(/[\d.]+/g).at(-1))<.25,'Chapter panel is translucent enough to see the scene');
 const initialY=M.y;
 pointer('pointerdown',70,160,200,chapter);pointer('pointermove',70,160,140);pointer('pointerup',70,160,140);M.cancelMotion();
 check(M.y<initialY-40,'Dragging upward works even over chapter text at minimum zoom');
 const upperY=M.y;pointer('pointerdown',71,160,140);pointer('pointermove',71,160,240);pointer('pointerup',71,160,240);M.cancelMotion();
 check(M.y>upperY+40,'Dragging downward reveals the upper part of the map');
 check(d.querySelectorAll('.map-mini .mini-window').length===1,'Minimap exposes the visible camera area');
 M.s=1.2;M.x=view.w/2-M.W*M.s/2;M.y=view.h/2-M.H*M.s/2;M.apply();
 const cx=view.w/2,cy=view.h/2,world=[(cx-M.x)/M.s,(cy-M.y)/M.s];M.zoom(1.15,cx,cy);
 check(near((cx-M.x)/M.s,world[0])&&near((cy-M.y)/M.s,world[1]),'Zoom preserves the world point beneath the cursor');
 M.zoom(100);check(near(M.s,M.max),'Zoom is capped at maximum');M.zoom(.00001);check(near(M.s,M.min),'Zoom is capped at minimum');
 M.s=1.2;M.focus(M.W/2,M.H/2,false);M.focus(300,300,true);check(!!M.motion,'Focus starts one camera animation');
 pointer('pointerdown',1,100,200);check(!M.motion,'A new gesture cancels camera focus');pointer('pointercancel',1,100,200);
 M.s=1.2;M.focus(M.W/2,M.H/2,false);
 pointer('pointerdown',1,100,200);pointer('pointerdown',2,200,200);
 const pinchWorld=[(150-M.x)/M.s,(200-M.y)/M.s],scale=M.s;
 pointer('pointermove',1,110,210);pointer('pointermove',2,210,210);
 check(near(M.s,scale)&&near((160-M.x)/M.s,pinchWorld[0])&&near((210-M.y)/M.s,pinchWorld[1]),'Two-finger pan preserves its world anchor');
 pointer('pointermove',1,80,190);pointer('pointermove',2,240,230);
 check(M.s>scale&&near((160-M.x)/M.s,pinchWorld[0])&&near((210-M.y)/M.s,pinchWorld[1]),'Pinch zoom keeps its midpoint fixed in the world');
 pointer('pointerup',2,240,230);const x=M.x,y=M.y;pointer('pointermove',1,82,192);
 check(Math.abs(M.x-x)<=2.1&&Math.abs(M.y-y)<=2.1,'Pinch to single-finger drag does not jump');pointer('pointerup',1,82,192);
 const hs=d.querySelector('.hs.shop');d.querySelector('#mapCard').hidden=true;
 hs.dispatchEvent(new w.MouseEvent('click',{bubbles:true,detail:1}));
 check(d.querySelector('#mapCard').hidden,'Finishing a drag cannot accidentally open a shop');
 hs.click();check(!d.querySelector('#mapCard').hidden,'Keyboard and explicit shop clicks remain available');
 d.querySelector('[data-m="close"]').click();
 M.findMenu();d.querySelector('[data-m="go"][data-id="trada"]').click();M.tick(.5);
 check(M.sel.id==='trada'&&d.querySelector('.hs[data-id="trada"]').getAttribute('aria-pressed')==='true','Find shop selects and focuses the correct marker');
 d.querySelector('[data-m="enter"]').click();check(w.WUI.isOpen()&&w.WUI.shop==='trada','Map card still opens the playable stall');w.WUI.close();
 M.s=1.2;M.focus(M.W/2,M.H/2,false);const oldWidth=frame.style.width,centerBefore=[(M.view().w/2-M.x)/M.s,(M.view().h/2-M.y)/M.s];
 frame.style.width='320px';M.fit(false);
 check(near((M.view().w/2-M.x)/M.s,centerBefore[0])&&near((M.view().h/2-M.y)/M.s,centerBefore[1]),'Resize preserves the camera world center');
 frame.style.width=oldWidth;M.fit(false);
 M.focus(900,500,true);w.dispatchEvent(new w.Event('blur'));
 check(!M.motion&&!M.drag&&M.pts.size===0&&M.vx===0&&M.vy===0,'Losing window focus clears camera motion');
 M.focus(M.W/2,M.H/2,false);M.vx=160;const inertiaStart=M.x;M.tick(.1);
 check(M.x>inertiaStart&&M.vx>0&&M.vx<160,'Inertia decays while continuing the last drag');M.cancelMotion();
 M.overview();G.S.settings.reduce=true;L.applySettings();
 const before=L.walkers.map(a=>[a.x,a.y]);L.tick(.5);
 check(L.walkers.every((a,i)=>a.x===before[i][0]&&a.y===before[i][1]),'Reduced motion freezes walkers');
 M.focus(900,500,true);check(!M.motion,'Reduced motion skips camera easing');
 G.S.settings.reduce=false;L.applySettings();
 UI.page='settings';const away=L.walkers[0].x;L.tick(.5);check(L.walkers[0].x===away,'Walkers stop updating away from the market');UI.page='market';
 const distanceToRoad=p=>Math.min(...L.routes.flatMap(path=>path.slice(1).map((b,i)=>{const a=path[i],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p.x-a[0])*dx+(p.y-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(p.x-a[0]-dx*t,p.y-a[1]-dy*t);}))); 
 let maxDistance=0,maxStep=0,offRoad=0;const start=performance.now();
 for(let step=0;step<1800;step++){
   const previous=L.walkers.map(a=>[a.x,a.y]);L.tick(.1);
   L.walkers.forEach((a,i)=>{if(!L.isWalkable(a.x,a.y))offRoad++;maxDistance=Math.max(maxDistance,distanceToRoad(a));maxStep=Math.max(maxStep,Math.hypot(a.x-previous[i][0],a.y-previous[i][1]));});
 }
 const simulationMs=performance.now()-start;
 check(maxDistance<12,'Rounded opposite lanes stay close to the road centerlines');
 check(offRoad===0,'Every simulated foot position remains on the independent ground mask');
 check(maxStep<4,'Villagers never teleport when turning or changing roads');
 check(L.walkers.every(a=>a.x>=0&&a.x<=M.W&&a.y>=0&&a.y<=M.H),'Every villager stays inside the scene');
 check(L.walkers.every(a=>!a.body.style.transform.includes('scaleX(0)')),'Turning never flattens a character');
 check(L.walkers.every((a,i)=>a.stride-i*1.7>22),'Every villager keeps moving without permanent traffic deadlocks');
 L.stopConversation();const probe=L.walkers[0],safe={x:probe.x,y:probe.y,links:[]},roof={x:300,y:335,links:[safe]};safe.links=[roof];
 probe.from=safe;probe.to=roof;probe.wait=0;let crossedWall=false;
 for(let i=0;i<300;i++){L.tick(.1);if(!L.isWalkable(probe.x,probe.y))crossedWall=true;}
 check(!crossedWall&&Math.hypot(probe.x-roof.x,probe.y-roof.y)>40,'Even an invalid target cannot drive a walker onto a roof');
 const simulate=step=>{G.S.settings.crowd=1;L.host=null;L.buildWalkers();L.accumulator=0;for(let t=0;t<500;t+=step*100)L.tick(step);return [L.walkers[0].x,L.walkers[0].y];};
 const fast=simulate(.02),slow=simulate(.05);
 check(Math.hypot(fast[0]-slow[0],fast[1]-slow[1])<1,'Walking speed remains consistent across frame rates');
 G.S.settings.crowd=1;L.host=null;L.buildWalkers();const smooth=L.walkers[0];smooth.wait=0;smooth.vm=smooth.speed;M.s=1.2;M.focus(smooth.x,smooth.y+70,false);
 let movedFrames=0;
 for(let i=0;i<30;i++){const before=smooth.x+smooth.y;L.tick(.016);if(smooth.x+smooth.y!==before)movedFrames++;}
 check(movedFrames===30,'Every 16 ms frame advances the walker without alternate-frame skipping');
 const laneDx=smooth.to.x-smooth.from.x,laneDy=smooth.to.y-smooth.from.y;
 const laneSide=(laneDx*(smooth.y-smooth.from.y)-laneDy*(smooth.x-smooth.from.x))/Math.hypot(laneDx,laneDy);
 check(laneSide>6&&laneSide<10,'A walker is spawned and remains in its direction-specific lane');
 G.S.settings.crowd=16;L.applySettings();M.overview();
 const pair=L.walkers.flatMap((a,i)=>L.walkers.slice(i+1).map(b=>[a,b])).find(([a,b])=>Math.hypot(a.x-b.x,a.y-b.y)>22&&Math.hypot(a.x-b.x,a.y-b.y)<100);
 check(!!pair,'A nearby pair exists on the road');
 M.s=1.2;M.focus((pair[0].x+pair[1].x)/2,(pair[0].y+pair[1].y)/2,false);
 check(L.startConversation(...pair,0),'Nearby villagers start a two-way conversation without teleporting');
 const positions=pair.map(a=>[a.x,a.y]);L.tick(.1);
 check(pair.every((a,i)=>a.x===positions[i][0]&&a.y===positions[i][1]),'Both speakers stop on the road while chatting');
 const bubbles=[...d.querySelectorAll('.market-chat')];
 check(bubbles.length===2&&!bubbles[0].hidden&&bubbles[1].hidden,'Only the opening speaker talks first');
 L.tickConversation(3.3);L.updateChats();
 check(!bubbles[1].hidden&&bubbles[1].textContent.includes(L.dialogues[0][1]),'The second villager replies with the paired line');
 const bubbleTransform=bubbles[1].style.transform;M.zoom(1.3);L.updateChats();
 check(bubbles[1].style.transform!==bubbleTransform,'Speech bubbles follow camera zoom');
 L.tickConversation(4);check(!L.conversation&&!d.querySelector('.market-chat')&&pair.every(a=>!a.chatting),'Conversation ends and releases both walkers');
 M.overview();const chatCount=L.chatCount;L.chatDue=0;for(let i=0;i<150&&!L.conversation;i++)L.tick(.1);
 check(L.chatCount>chatCount&&!!L.conversation,'Ambient conversations start automatically between nearby walkers');L.stopConversation();
 L.startConversation(...pair,1);G.S.settings.reduce=true;L.applySettings();
 check(!L.conversation&&!d.querySelector('.market-chat'),'Reduced motion clears ambient dialogue');G.S.settings.reduce=false;L.applySettings();
 G.S.settings.crowd=0;L.applySettings();M.lastUn=-1;M.refresh();check(!d.querySelector('.pedestrian,.wk'),'Zero crowd stays empty after an unlock refresh');
 G.S.settings.crowd=10;L.applySettings();M.focus(...G.shopDef('trada').map,false);
 await Promise.all([...d.images].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=resolve;im.onerror=resolve;})));
 check([...d.images].every(im=>im.complete&&im.naturalWidth>0),'Scene and minimap images load');
 const scene=d.querySelector('.map-img');check(scene.naturalWidth===M.W&&scene.naturalHeight===M.H,'Portrait image dimensions match the world without stretching');
 const atlas=new w.Image();atlas.src='assets/market/people-atlas.png';
 await new Promise((resolve,reject)=>{atlas.onload=resolve;atlas.onerror=()=>reject(Error('Character atlas failed to load'));});
 check(atlas.naturalWidth===atlas.naturalHeight&&atlas.naturalWidth>=1024,'Character atlas is a sharp square four-by-four sheet');
 check(errors.length===0,'No runtime errors');
 document.querySelector('#result').textContent=JSON.stringify({status:'PASS',count:passed.length,passed,simulationMs,maxDistance,maxStep,errors},null,2);
}catch(e){document.querySelector('#result').textContent=JSON.stringify({status:'FAIL',message:e.stack,passed,errors},null,2);}
});
</script></html>
