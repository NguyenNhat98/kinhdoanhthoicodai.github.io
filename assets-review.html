<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đối chiếu sprite Chợ Cổ</title>
<style>body{margin:24px;font:14px system-ui;background:#fcf3df;color:#503520}h1{font-family:Georgia}select{padding:10px;font:inherit}#source{position:relative;width:min(100%,1100px);margin:20px 0}#source>img{display:block;width:100%}.rect{position:absolute;border:1px solid #0096ff;box-sizing:border-box;pointer-events:none}.rect.active{border:3px solid red;background:#ff000015}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.asset{padding:10px;border:1px solid #bb9e77;border-radius:8px;cursor:pointer}.asset img{display:block;width:100%;height:110px;object-fit:contain;background:repeating-conic-gradient(#ddd 0% 25%,white 0% 50%) 0/16px 16px}.asset code{display:block;font-size:11px;word-break:break-all;margin-top:7px}.asset small{font-size:10px}button{font:inherit;padding:7px}</style>
<h1>Đối chiếu vùng tách sprite</h1><p>Chọn bộ ảnh. Nhấn một icon để tô đỏ đúng vùng lấy từ ảnh gốc. Nền caro dưới icon là nền kiểm tra độ trong suốt. Tọa độ và tên lưu trong <a href="assets/sprites/manifest.json">manifest</a>.</p><select id="sheet"></select><div id="source"></div><div id="grid"></div><script src="assets/sprites/manifest.js"></script><script>
const sheets=[...new Set(SPRITES.map(a=>a.sheet))],select=document.querySelector('#sheet');select.innerHTML=sheets.map(s=>`<option>${s}</option>`).join('');
function render(){const entries=SPRITES.filter(a=>a.sheet===select.value);document.querySelector('#source').innerHTML=`<img src="assets/source/${encodeURIComponent(select.value)}" alt="Bảng ảnh gốc">`+entries.map(a=>{const [x,y,w,h]=a.rect;return `<div class="rect" data-id="${a.id}" style="left:${x/(a.sheetWidth||1536)*100}%;top:${y/(a.sheetHeight||1024)*100}%;width:${w/(a.sheetWidth||1536)*100}%;height:${h/(a.sheetHeight||1024)*100}%"></div>`}).join('');document.querySelector('#grid').innerHTML=entries.map(a=>`<button class="asset" data-id="${a.id}"><img src="${a.url}" alt="${a.id}"><code>${a.id}</code><small>${a.rect.join(', ')}</small></button>`).join('');}select.onchange=render;document.querySelector('#grid').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;document.querySelectorAll('.rect').forEach(r=>r.classList.toggle('active',r.dataset.id===b.dataset.id));document.querySelector('#source').scrollIntoView({behavior:'smooth'});};render();
</script></html>
